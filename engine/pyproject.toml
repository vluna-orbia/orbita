[project]
name = "orbita-engine"
version = "0.1.0"
description = "Motor de investigación de Órbita. Esqueleto del encargo 2; el pipeline LangGraph llega con el encargo 6."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "langgraph>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
